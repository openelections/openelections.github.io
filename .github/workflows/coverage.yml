# Rebuild the per-election coverage JSON that powers the Election Coverage
# card on /state/?abbr=XX (data/coverage/*.json), then commit the result.
# Committing to master triggers the Pages deployment workflow.

name: Build election coverage JSON

on:
  schedule:
    # nightly, a few minutes before the top of the hour
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "coverage-build"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build coverage JSON
        run: python scripts/build_coverage.py
        env:
          GITHUB_TOKEN: ${{ secrets.OPENELECTIONS_GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain data/coverage)" ]; then
            git config user.name "openelections-bot"
            git config user.email "openelections-bot@users.noreply.github.com"
            git add data/coverage
            git commit -m "Rebuild election coverage JSON [skip ci]"
            git push
          else
            echo "No coverage changes"
          fi
